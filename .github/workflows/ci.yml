# CI Pipeline: no API key is needed because all AI responses in the tests are mocked

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # quick check: run Python syntax and unit tests directly on a Python runner
  unit-tests:
    name: Unit tests (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q OOP tests

      - name: Run tests
        run: python -B -m unittest discover -s tests -t . -v

  # verify React + Vite dependencies install cleanly and compile without errors
  frontend-checks:
    name: Frontend build check (Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build frontend bundle
        run: npm --prefix frontend run build

  # the brief says tests must pass inside Docker, so verify Compose config and offline Docker tests
  docker-tests:
    name: Docker build and tests
    runs-on: ubuntu-latest
    needs: [unit-tests, frontend-checks]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Validate Docker Compose config
        run: docker compose config --quiet

      - name: Build Docker image
        run: docker build -t resume-screener-ui:ci .

      - name: Run tests inside the container (no network)
        run: >
          docker run --rm --network none
          --entrypoint python
          resume-screener-ui:ci
          -B -m unittest discover -s tests -t . -v
