# CI Pipeline: no API key is needed because all AI responses in the tests are mocked

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # quick check: run the tests directly on a Python runner
  unit-tests:
    name: Unit tests (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -B -m unittest discover -s tests -t . -v

  # the brief says tests must pass inside Docker, so check that too
  docker-tests:
    name: Docker build and tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t resume-screener-ui:ci .

      - name: Run tests inside the container (no network)
        run: >
          docker run --rm --network none
          --entrypoint python
          resume-screener-ui:ci
          -B -m unittest discover -s tests -t . -v
